workflows:
  unity-build:
    name: Unity Build - AviatorDash
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      unity: 6000.0.63f1
      vars:
        BUILD_PLATFORM: android
      groups:
        - unity_credentials 
    scripts:
      - name: Activate Unity license
        script: |
          echo "Activating Unity license..."
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode \
            -quit \
            -logFile unity_license.log \
            -serial $UNITY_SERIAL \
            -username $UNITY_EMAIL \
            -password $UNITY_PASSWORD


      - name: Build AAB
        script: |
          echo "Building AAB..."
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode \
            -quit \
            -logFile unity_build_aab.log \
            -projectPath . \
            -executeMethod BuildScript.PerformBuildAAB \
            -nographics

      - name: Build APK
        script: |
          echo "Building APK..."
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode \
            -quit \
            -logFile unity_build_apk.log \
            -projectPath . \
            -executeMethod BuildScript.PerformBuildAPK \
            -nographics

      - name: Return (deactivate) Unity license
        script: |
          echo "Returning Unity license..."
          "$UNITY_HOME/Contents/MacOS/Unity" \
          -batchmode -quit -returnLicense || true

    artifacts:
      - AviatorDash.aab
      - AviatorDash.apk
      - unity_build_aab.log
      - unity_build_apk.log
      - unity_license.log